name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh archive.sh tests/smoke.sh

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zsh, tmux and vim
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux  # zsh and vim ship with macOS
          else
            sudo apt-get update
            sudo apt-get install -y zsh tmux vim
          fi
      - run: tests/smoke.sh

  # older tool versions, as found on long-lived servers: vim 8.2 (too old for
  # vim-go), tmux 3.2a, zsh 5.8 and no `python` command
  smoke-ubuntu-22_04:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install git, zsh, tmux and vim
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git zsh tmux vim python3
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the workspace belongs to the runner user, not the container's root:
      # take ownership so git and zsh's compaudit accept it, as they would a
      # user's own clone
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - run: tests/smoke.sh
